[package]
name = "omni-graph"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Project memory and learning graph for AI agents"
license = "MIT"
repository = "https://github.com/Rekabytes-Enterprise/omni-graph"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
flate2 = "1"
fs2 = "0.4"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tiny_http = "0.12"
ureq = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
