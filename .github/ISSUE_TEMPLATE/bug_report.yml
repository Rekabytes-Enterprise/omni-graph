name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not attach memory databases, credentials, PINs, or client information.
        For vulnerabilities, follow [SECURITY.md](https://github.com/Rekabytes-Enterprise/omni-graph/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Omni-graph version
      description: Output of omni-graph --version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/version, CPU architecture, install method, terminal/browser, and agent if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal example using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
      description: Review logs and screenshots for private information before sharing.
    validations:
      required: true
