name: Build release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage executable and native archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "native/$PLATFORM" release-assets
          executable=omni-graph
          if [[ "$PLATFORM" == win32-* ]]; then executable=omni-graph.exe; fi
          cp "target/$TARGET/release/$executable" "native/$PLATFORM/"
          tar -czf "release-assets/omni-graph-$PLATFORM.tar.gz" -C "native/$PLATFORM" "$executable"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}
          path: release-assets/
  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native/
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist/
      - run: chmod +x native/darwin-*/omni-graph native/linux-*/omni-graph
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          node scripts/check-package.mjs
          if [ "$IS_TAG" = true ]; then
            test "$RELEASE_TAG" = "v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          fi
          node bin/omni-graph.mjs --version
          sh -n install.sh
      - run: npm pack --pack-destination dist
      - name: Assemble checksums
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum *.tar.gz *.tgz install.sh > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: omni-graph-release
          path: dist/
  publish-github:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: omni-graph-release
          path: dist/
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Omni-graph $RELEASE_TAG"
